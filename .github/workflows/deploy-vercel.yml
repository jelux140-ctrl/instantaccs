name: Deploy production to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: creed-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Reject outdated commits
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$GITHUB_SHA" != "$latest" ]; then
            echo "This run is for $GITHUB_SHA, but main is now $latest. Skipping stale deployment."
            exit 1
          fi
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull production configuration
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Build
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Deploy production
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$GITHUB_SHA" != "$latest" ]; then
            echo "main moved to $latest while this run was building; refusing to deploy $GITHUB_SHA."
            exit 1
          fi
          vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
