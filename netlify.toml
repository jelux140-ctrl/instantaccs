# --- Hide raw source of the Netlify glue from static serving ---------------
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# ------------------------------------------------------------------- Headers
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain"

# CORS for /api/* is applied inside the compatibility adapter (netlify/adapter.js)
# so it matches per-function overrides without duplicating headers.
