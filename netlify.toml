# =============================================================================
# CREED — Netlify configuration (migrated from vercel.json)
# =============================================================================

[build]
  publish = "."
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"
  # Static site — no build command needed.

[functions]
  node_bundler = "esbuild"
  # Bundle the original /api handler sources (imported by the dispatcher) and
  # any assets they read.
  included_files = ["api/**"]

# ------------------------------------------------------------------ Redirects
# NOTE: order matters — first match wins. The /api/* dispatcher and the
# /* edge maintenance gate are wired via [build].functions / edge_functions,
# not here.

# --- Permanent (301) redirects ---------------------------------------------
[[redirects]]
  from = "/reviews"
  to = "/vouches"
  status = 301

[[redirects]]
  from = "/reviews/"
  to = "/vouches"
  status = 301

[[redirects]]
  from = "/portal"
  to = "https://portal.creedv2.com/"
  status = 301
  force = true

[[redirects]]
  from = "/portal/"
  to = "https://portal.creedv2.com/"
  status = 301
  force = true

# --- Rewrites (200) : friendly URLs that map to functions ------------------
[[redirects]]
  from = "/sitemap.xml"
  to = "/api/sitemap-blogs"
  status = 200

[[redirects]]
  from = "/feed"
  to = "/api/rss"
  status = 200

[[redirects]]
  from = "/rss"
  to = "/api/rss"
  status = 200

[[redirects]]
  from = "/blog/:slug"
  to = "/api/blog-ssr?slug=:slug"
  status = 200

# --- Rewrites (200) : clean URLs -> static .html ---------------------------
[[redirects]]
