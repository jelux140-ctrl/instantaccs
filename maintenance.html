<!DOCTYPE html>
<html lang="en">
<head>
    <script>/*creed-start-at-top*/(function(){try{var n=(performance.getEntriesByType&&performance.getEntriesByType('navigation')[0])||null;var t=n&&n.type?n.type:'navigate';if(t==='navigate'&&!location.hash&&'scrollRestoration' in history){history.scrollRestoration='manual';window.scrollTo(0,0);}}catch(e){}})();</script>

    <link rel="icon" type="image/png" href="/assets/creedlogo-black.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>We’ll be right back | Creed</title>
    <link rel="stylesheet" href="/styles.css?v=cursor3">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #0a0a0a;
            color: #fff;
        }
        .box {
            max-width: 420px;
            width: 100%;
            padding: 32px;
            border-radius: 12px;
            border: 1px solid rgba(255, 184, 0, 0.3);
            background: rgba(255, 255, 255, 0.05);
        }
        h1 {
            font-size: 1.35rem;
            margin-bottom: 8px;
            color: #FFB800;
        }
        p { color: #aaa; font-size: 0.95rem; line-height: 1.5; margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; color: #ccc; font-size: 0.9rem; }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 184, 0, 0.3);
            background: rgba(0,0,0,0.4);
            color: #fff;
            font-size: 16px;
            margin-bottom: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #FFB800 0%, #FFD700 100%);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { filter: brightness(1.05); }
        #msg { color: #f87171; font-size: 0.88rem; margin-top: 10px; min-height: 1.2em; }
    </style>
</head>
<body>
    <div class="box glass-panel">
        <h1>Storefront maintenance</h1>
        <p>This site is temporarily closed for updates. Enter the password you were given to continue to the store.</p>
        <form id="form">
            <label for="pw">Password</label>
            <input type="password" id="pw" name="pw" autocomplete="current-password" required>
            <button type="submit">Continue to store</button>
        </form>
        <p id="msg"></p>
    </div>
    <script>
        document.getElementById('form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const msg = document.getElementById('msg');
            msg.textContent = '';
            const password = document.getElementById('pw').value;
            try {
                const r = await fetch('/api/maintenance-unlock', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password }),
                });
                const data = await r.json().catch(() => ({}));
                if (!r.ok) throw new Error(data.error || r.statusText);
                window.location.href = '/';
            } catch (err) {
                msg.textContent = err.message || 'Could not unlock.';
            }
        });
    </script>
</body>
</html>
